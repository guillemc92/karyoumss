[pytest]
DJANGO_SETTINGS_MODULE = clinic_backend.settings
python_files = tests.py test_*.py *_tests.py
addopts = --cov=apps --cov-report=term-missing --cov-fail-under=90
markers =
    agente: test generado por un agente, todavia sin auditar
    auditado: test generado por un agente y aceptado por una persona
