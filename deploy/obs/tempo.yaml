# Tempo en una sola instancia, con almacenamiento local (DD-OBS-001 D5).
# Recibe las trazas por OTLP/HTTP en 4318 y Grafana las consulta en 3200.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Una traza se puede buscar pocos segundos después de terminar: en la demo se
  # abre justo después de la prueba de carga.
  trace_idle_period: 5s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
