# pytest — backend-admin (F6)
#
# Decisiones:
# - DJANGO_SETTINGS_MODULE = admin_backend.settings (el settings principal);
#   el override de DB a SQLite se hace via conftest.py ANTES de que Django lea
#   settings.DATABASES — así _admin_schema_table('admin_users') en models.py
#   ve ENGINE=sqlite y devuelve nombre plano.
# - DB persistente en archivo (no :memory:) porque django-auditlog crea triggers
#   y señales que se pierden entre conexiones en memory.
# - addopts "--reuse-db" acelera iteraciones; en CI correr con --create-db para
#   empezar limpio.

[pytest]
DJANGO_SETTINGS_MODULE = admin_backend.settings_test
python_files = test_*.py *_test.py
testpaths = apps
addopts =
    -ra
    --strict-markers
    --tb=short
    --cov=apps
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml:coverage.xml
    --no-cov-on-fail
markers =
    slow: tests lentos (>1s)

# Cobertura — RN-09: ≥90% lines/branches/functions/statements.
# Excluimos migrations (schema DDL, no lógica) y admin.py (Django admin site).
[coverage:run]
source =
    apps/users
    apps/audit
omit =
    apps/*/migrations/*
    apps/*/admin.py
    apps/*/__init__.py

[coverage:report]
# RN-09 threshold. fail_under es global; los archivos triviales (migrations/admin)
# ya están omitidos.
fail_under = 90
exclude_lines =
    pragma: no cover
    raise NotImplementedError
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    \.\.\.