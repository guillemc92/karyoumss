# DD-API-001 — El contrato OpenAPI se comprueba en cada pull request.
#
# Por cada servicio (backend-clinic, backend-ml):
#   1. Drift: se regenera el contrato desde el código y `git diff` debe salir vacío.
#   2. Lint: Spectral con .spectral.yaml; falla con cualquier ERROR.
#   3. Cambios incompatibles: oasdiff contra el contrato de la rama base del PR.
#   4. Conformidad (solo backend-ml): Schemathesis contra el servicio levantado.
#
# Los secretos que exige backend-clinic se generan en el propio job: valores de
# un solo uso que solo sirven para importar Django y generar el contrato.

name: Contrato OpenAPI

on:
  pull_request:
  push:
    branches: ['release/**']

permissions:
  contents: read

concurrency:
  group: contrato-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clinic:
    name: backend-clinic · drift, Spectral, oasdiff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-clinic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-clinic/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Secretos de un solo uso para el job
        run: |
          {
            echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)"
            echo "AUTH_ADMIN_JWT_SECRET=$(openssl rand -hex 32)"
            echo "INTERNAL_SERVICE_SECRET=$(openssl rand -hex 32)"
            echo "PATIENT_VAULT_KEY=$(python -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          } >> "$GITHUB_ENV"

      - name: 1 · Drift — el archivo del repositorio es el que genera el código
        run: |
          python manage.py spectacular --format openapi-json --file openapi.json --validate --fail-on-warn
          if ! git diff --exit-code -- openapi.json; then
            echo "::error file=backend-clinic/openapi.json::El contrato no coincide con el código. Regenerar con: python manage.py spectacular --format openapi-json --file openapi.json --validate"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 2 · Spectral — lint del contrato
        working-directory: .
        run: npx --yes @stoplight/spectral-cli@6.14.2 lint backend-clinic/openapi.json --ruleset .spectral.yaml --fail-severity error

      - name: 3a · Contrato de la rama base
        if: github.event_name == 'pull_request'
        id: base
        working-directory: .
        run: |
          if git show "origin/${{ github.base_ref }}:backend-clinic/openapi.json" > "$RUNNER_TEMP/base-clinic.json" 2>/dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::La rama base todavía no tiene backend-clinic/openapi.json: no hay contra qué comparar."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 3b · oasdiff — cambios incompatibles contra la rama base
        if: github.event_name == 'pull_request' && steps.base.outputs.existe == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.18
        with:
          base: ${{ runner.temp }}/base-clinic.json
          revision: backend-clinic/openapi.json
          fail-on: ERR

  ml:
    name: backend-ml · drift, Spectral, oasdiff, Schemathesis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend-ml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sin torch: el contrato no depende del modelo y el clasificador se carga en
      # perezoso (sin torch usa el de reserva). Ahorra ~1 GB de descarga por job.
      - name: Instalar dependencias (sin torch)
        run: pip install "fastapi>=0.110" "uvicorn[standard]>=0.29" "python-multipart>=0.0.9" "opencv-python-headless>=4.9" "numpy>=1.26" "httpx>=0.27" "schemathesis==4.30.1"

      - name: 1 · Drift — el archivo del repositorio es el que genera el código
        run: |
          python -m app.exportar_openapi
          if ! git diff --exit-code -- openapi.json; then
            echo "::error file=backend-ml/openapi.json::El contrato no coincide con el código. Regenerar con: python -m app.exportar_openapi"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 2 · Spectral — lint del contrato
        working-directory: .
        run: npx --yes @stoplight/spectral-cli@6.14.2 lint backend-ml/openapi.json --ruleset .spectral.yaml --fail-severity error

      - name: 3a · Contrato de la rama base
        if: github.event_name == 'pull_request'
        id: base
        working-directory: .
        run: |
          if git show "origin/${{ github.base_ref }}:backend-ml/openapi.json" > "$RUNNER_TEMP/base-ml.json" 2>/dev/null; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::La rama base todavía no tiene backend-ml/openapi.json: no hay contra qué comparar."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 3b · oasdiff — cambios incompatibles contra la rama base
        if: github.event_name == 'pull_request' && steps.base.outputs.existe == 'true'
        uses: oasdiff/oasdiff-action/breaking@v0.1.18
        with:
          base: ${{ runner.temp }}/base-ml.json
          revision: backend-ml/openapi.json
          fail-on: ERR

      - name: 4 · Schemathesis — la API viva cumple su contrato
        run: |
          python -m uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/uvicorn.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health/ > /dev/null && break; sleep 1; done
          st run openapi.json --url http://127.0.0.1:8000 \
            --include-tag "Edición de la metafase" --include-tag Salud \
            --checks not_a_server_error,response_schema_conformance,status_code_conformance \
            --max-examples 20
