# Stack de producción de BIOMED UMSS (DD-OPS-001). Desde un clon limpio:
#
#   docker compose up -d --wait                  todo, sin el LLM
#   BIOMED_LLM=true docker compose --profile ia up -d --wait
#                                                con Ollama y llama3.2:3b (~2 GB la 1.ª vez)
#
#   BIOMED_TRAZAS=http://tempo:4318 docker compose --profile obs up -d --wait
#                                                con trazas: Tempo y Grafana (DD-OBS-001)
#
# Entrada: http://localhost:8080/ (administración) y http://localhost:8080/clinic/.
# Con el perfil obs, Grafana queda en http://localhost:3000/ (Explore → Tempo).
# Usuarios de la demo: admin@, analista@ y supervisor@biomed.local. Su contraseña:
#
#   docker compose run --rm --no-deps secretos cat /secretos/admin/DEMO_PASSWORD_ANALISTA
#
# Los secretos se generan al primer arranque en el volumen `secretos` (D3): no
# están en git ni en ninguna imagen. Sobreviven a `down`; `down -v` los borra.
name: biomed

# Los jobs usan la imagen que construyen `clinic` y `admin`: una sola compilación
# por imagen, y ninguna descarga de una imagen que no existe en un registro.
x-clinic-imagen: &clinic-imagen
  image: biomed/backend-clinic:8.3.0
  pull_policy: never

x-admin-imagen: &admin-imagen
  image: biomed/backend-admin:8.3.0
  pull_policy: never

x-clinic-entorno: &clinic-entorno
  BIOMED_SECRETS_DIR: /secretos/clinic
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,clinic
  CLINIC_DB_NAME: /datos/clinic/clinic.sqlite3
  CLINIC_MEDIA_DIR: /datos/clinic/media
  CLINIC_FASTAPI_URL: http://ml:8000
  # Segmentar una metafase tarda ~19 s en CPU: el plazo de desarrollo (2 s) la cortaría.
  CLINIC_FASTAPI_TIMEOUT: "120"
  ADMIN_INTERNAL_URL: http://admin:8000
  CLINIC_LLM_ENABLED: ${BIOMED_LLM:-false}
  CLINIC_LLM_URL: http://ollama:11434/v1
  # DD-OBS-001: vacío = sin trazas. Con el perfil obs se pone http://tempo:4318.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${BIOMED_TRAZAS:-}

x-admin-entorno: &admin-entorno
  BIOMED_SECRETS_DIR: /secretos/admin
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,admin
  DB_ENGINE: postgres
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: biomed
  POSTGRES_USER: biomed_admin_service

services:
  # --- Jobs de un solo uso: terminan con 0 antes de que arranque lo demás ---

  secretos:
    <<: *clinic-imagen
    # Es el único que corre como root: tiene que dar cada carpeta al usuario que
    # la lee (10001 para las apps, 70 para postgres). Termina en segundos.
    user: "0"
    command: ["python", "scripts/generar_secretos.py", "/secretos"]
    volumes:
      - secretos:/secretos
    restart: "no"

  migrar-admin:
    <<: *admin-imagen
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py sembrar_stack"]
    environment: *admin-entorno
    volumes:
      - secretos:/secretos:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrar-clinic:
    <<: *clinic-imagen
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *clinic-entorno
    volumes:
      - secretos:/secretos:ro
      - clinic-datos:/datos/clinic
    depends_on:
      secretos:
        condition: service_completed_successfully
    restart: "no"

  # --- Servicios ---

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: biomed
      POSTGRES_PASSWORD_FILE: /secretos/postgres/POSTGRES_PASSWORD
    volumes:
      - secretos:/secretos:ro
      - pg-datos:/var/lib/postgresql/data
      - ./deploy/postgres/10-rol-admin.sh:/docker-entrypoint-initdb.d/10-rol-admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biomed"]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      secretos:
        condition: service_completed_successfully
    restart: unless-stopped

  admin:
    image: biomed/backend-admin:8.3.0
    build: ./backend-admin
    environment: *admin-entorno
    volumes:
      - secretos:/secretos:ro
    depends_on:
      migrar-admin:
        condition: service_completed_successfully
    restart: unless-stopped

  clinic:
    image: biomed/backend-clinic:8.3.0
    build: ./backend-clinic
    environment:
      <<: *clinic-entorno
      GUNICORN_CMD_ARGS: --timeout 180
    volumes:
      - secretos:/secretos:ro
      - clinic-datos:/datos/clinic
    depends_on:
      migrar-clinic:
        condition: service_completed_successfully
      ml:
        condition: service_healthy
    restart: unless-stopped

  ml:
    image: biomed/backend-ml:8.3.0
    build: ./backend-ml
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${BIOMED_TRAZAS:-}
    restart: unless-stopped

  web:
    image: biomed/web:8.3.0
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      admin:
        condition: service_healthy
      clinic:
        condition: service_healthy
    restart: unless-stopped

  # --- Trazas (DD-OBS-001), solo con --profile obs ---

  tempo-volumen:
    <<: *clinic-imagen
    profiles: ["obs"]
    # Tempo corre como 10001 y el volumen nace de root: se le da antes de arrancar.
    user: "0"
    command: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-datos:/var/tempo
    restart: "no"

  tempo:
    image: grafana/tempo:2.9.0@sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4
    profiles: ["obs"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/obs/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-datos:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 4s
      retries: 24
    depends_on:
      tempo-volumen:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.3.0@sha256:70d9599b186ce287be0d2c5ba9a78acb2e86c1a68c9c41449454d0fc3eeb84e8
    profiles: ["obs"]
    environment:
      # Sin usuarios: solo se publica en 127.0.0.1. El rol Editor hace falta para
      # usar Explore. En un despliegue real iría detrás del SSO (DD-OBS-001 D5).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./deploy/obs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 4s
      retries: 24
    depends_on:
      tempo:
        condition: service_healthy
    restart: unless-stopped

  # --- Prueba de carga (DD-OBS-001 D6), solo con --profile carga ---
  #   docker compose --profile carga run --rm carga-semilla
  #   docker compose --profile carga run --rm k6 run /k6/carga.js

  carga-semilla:
    <<: *clinic-imagen
    profiles: ["carga"]
    # Muestras ficticias con una metafase sintética, y un token para k6. Sin PII.
    command:
      - sh
      - -c
      - >-
        python manage.py sembrar_carga --muestras ${CARGA_MUESTRAS:-20} --salida /k6data &&
        python manage.py token_bench --salida /k6data/token.txt
    environment: *clinic-entorno
    volumes:
      - secretos:/secretos:ro
      - clinic-datos:/datos/clinic
      - k6data:/k6data
    restart: "no"

  k6:
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
    profiles: ["carga"]
    volumes:
      - ./bench/demo4/carga.js:/k6/carga.js:ro
      - k6data:/datos:ro
      - ./bench/demo4/resultados:/out

  # --- El LLM local (ADR-0024), solo con --profile ia (D5) ---

  ollama:
    image: ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6
    profiles: ["ia"]
    volumes:
      - ollama-modelos:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  ollama-modelo:
    image: ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6
    profiles: ["ia"]
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "llama3.2:3b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  secretos:
  pg-datos:
  clinic-datos:
  ollama-modelos:
  tempo-datos:
  k6data:
